# Solo project config. Processes are deliberately empty.
#
# Whatever serves the app owns its long-running processes. Under Orbit that is
# Orbit itself (`orbit process:add`), whose runtime units inject APP_URL,
# VITE_APP_URL and the VITE_DEV_SERVER_KEY / VITE_DEV_SERVER_CERT pair that Vite
# needs to serve assets over the Orbit domain. Declaring the same commands here
# would run them a second time, without those variables.
#
# Only define processes below when Orbit is NOT managing this project. See
# https://launch.nckrtl.com/solo.md for the block to paste in.
name: launch
icon: null
processes: {}
